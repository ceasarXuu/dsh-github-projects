# dsh-github-projects — bundle layer.
#
# One host row: the HTTP API (under /plugin/github-projects), the durable
# workspace→Project / session→Issue bindings, and the `gh` CLI adapter.
# The browser half is discovered from `dsh.client` in package.json; it registers
# the `projects` and `issue` conversation views.
#
# A profile patch for row id `github-projects` replaces this whole `config`
# object, so restate every key you need there.
- insert:
    - id: github-projects
      name: '@ceasarxuu/dsh-github-projects'
      config:
        # `gh` executable. Absolute path is recommended when PATH differs
        # between a terminal and the Desktop host.
        ghCommand: gh
        # One `gh` invocation deadline.
        requestTimeoutMs: 20000
        # In-memory GitHub response cache: fresh window.
        cacheTtlMs: 60000
        # Expired entries are still served (stale) for this long while a
        # background refresh revalidates them.
        staleTtlMs: 600000
        # Persist successful cache values to cacheFile so a DSH restart can
        # render the last data before GitHub answers.
        diskCache: true
        # Cache snapshot file; null resolves to
        # $DSH_HOME/plugin-data/github-projects/cache.json
        cacheFile: null
        # Upper bound of project items returned by one items read.
        maxProjectItems: 200
        # Upper bound of issue comments returned by one issue read.
        maxComments: 30
        # TTL of the cached `gh` health probe used by /config and /health.
        healthCacheTtlMs: 5000
        # Bound on the first /config health probe; may answer error='pending' on timeout.
        healthFirstReadTimeoutMs: 3000
        # Durable binding file; null resolves to
        # $DSH_HOME/plugin-data/github-projects/state.json
        statePath: null
        # v1.2.0 workspace branch chip (left sidebar): the local `git`
        # executable. Absolute path recommended when PATH differs between a
        # terminal and the Desktop host.
        gitCommand: git
        # One `git symbolic-ref`/`rev-parse` invocation deadline.
        gitTimeoutMs: 4000
        # How long one workspace's branch stays fresh before GET /branches
        # re-reads it. A human prompt and the 15 s client poll both refresh on
        # their own; this only bounds an external `git checkout`.
        branchTtlMs: 30000
        # v1.3.0 workspace auto-bind: fill an unbound workspace's Project from
        # the GitHub repository its `origin` remote names. It only ever fills a
        # gap — a Project you bound yourself is never replaced. Set false to
        # keep the manual picker only.
        autoBind: true
        # How long one resolved auto-bind answer (including "no Project") is
        # trusted before it is re-checked.
        autoBindTtlMs: 600000
        # Opt-in GitHub writes from the sidebar; the existing agent tool still
        # updates only item Status. GitHub enforces Project and repository permissions.
        allowWrites: false
