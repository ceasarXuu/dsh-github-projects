name: publish

# Publishes to npm with Trusted Publishing (OIDC): no token, no 2FA prompt, and
# provenance is attached automatically because this repository is public.
#
# The npm side must trust exactly this file: @ceasarxuu/dsh-github-projects →
# Settings → Trusted publishing → GitHub Actions, owner `ceasarXuu`, repository
# `dsh-github-projects`, workflow filename `publish.yml`, environment blank.
# Renaming this file silently breaks publishing — the OIDC claim carries the name.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # The whole mechanism: the runner mints an OIDC token that npm exchanges for a
  # short-lived publish credential bound to this workflow run.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1 on node >= 22.14; node 24 ships
          # a new enough npm, and the step below pins the latest anyway.
          node-version: '24'
          # Deliberately no `registry-url`: setup-node would write an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}`, and that empty token shadows OIDC —
          # the publish then fails with ENEEDAUTH.

      - name: upgrade npm
        run: npm install --global npm@latest

      - name: versions
        run: |
          node --version
          npm --version
          node -p "'publishing ' + require('./package.json').name + '@' + require('./package.json').version"

      # No dependencies, and the suite only imports node builtins, so this runs
      # without an install step.
      - name: tests
        run: npm test

      - name: the tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi

      - name: publish
        run: npm publish --access public
